<!DOCTYPE html>
<html>
<body>
<script>
const ws = new WebSocket("ws://localhost:8080/ws");

ws.onopen = () => {
    console.log("Connected to server");
    ws.send("Hello server!");
};

ws.onmessage = (msg) => {
    console.log("Received:", msg.data);
};

ws.onclose = () => {
    console.log("Connection closed");
};
</script>
</body>
</html>
